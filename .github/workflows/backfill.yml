name: backfill
on:
  workflow_dispatch: {}
jobs:
  backfill:
    runs-on: ubuntu-latest
    # 30 min: the July baseline ran 13-16 min with NCEI healthy, and the #446
    # incident showed 20 left no slack for one slow/down source. The backfill
    # client is bounded (2 attempts, 10s timeout), so this is headroom, not
    # license to hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
      - name: Sync dependencies
        run: uv sync
      - name: Backfill calibration and backtest accuracy for every city
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "DATABASE_URL is not a Postgres DSN; refusing to run (would silently write to ephemeral SQLite)"; exit 1 ;;
          esac
          uv run rainmaker backfill --city all --variable all --leads 0,1,2,3
