name: daily-diagnostics
on:
  schedule:
    # Once a day, after the 21:00 scheduled-run settle so the day's snapshot
    # row covers the fullest day (#277: track/snapshot/tail-check moved off
    # the 3h cron to cut Supabase egress). track and tail-check each print a
    # full-history view and a since-filtered view of the active regime via two
    # invocations; attribution prints both views from one invocation, sharing
    # a single settled-rows read (#334).
    - cron: "45 21 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
  issues: write
  actions: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync
      - name: Write tracking snapshot
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "DATABASE_URL is not a Postgres DSN; refusing to run (would silently write to ephemeral SQLite)"; exit 1 ;;
          esac
          uv run rainmaker snapshot
      - name: Print track, tail-check, and attribution summaries
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # REGIME_SINCE is the active calibration regime's start (first full day
          # after the 2026-07-17 TMIN Student-t refit, #292/#299); bump this
          # value in the same change that records the next refit (see
          # docs/operations/README.md). Single-sourced here for every --since
          # call below.
          REGIME_SINCE: "2026-07-18"
        run: |
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "DATABASE_URL is not a Postgres DSN; refusing to run"; exit 1 ;;
          esac
          uv run rainmaker track
          uv run rainmaker track --since "$REGIME_SINCE"
          uv run rainmaker tail-check
          uv run rainmaker tail-check --since "$REGIME_SINCE"
          uv run rainmaker attribution --since "$REGIME_SINCE"
          uv run rainmaker calibration-check
  notify:
    runs-on: ubuntu-latest
    needs: [diagnostics]
    if: failure()
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Alert on failure
        run: |
          bash scripts/notify_failure.sh \
            "daily-diagnostics" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${{ github.run_id }}"
