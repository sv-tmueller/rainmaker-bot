# On-demand only: dispatch it from the Actions tab (Run workflow). It runs the
# delay-replay diagnostic against prod Supabase. Each run costs one full read of
# the settled history (free-tier egress, #277 and #469) plus one CLOB
# price-history request per bet. Run once per question and read the job summary
# or the artifact instead of dispatching again.
name: delay-replay
on:
  workflow_dispatch:
    inputs:
      since:
        description: "regime (REGIME_SINCE from daily-diagnostics.yml), all (full history), or a YYYY-MM-DD date"
        type: string
        required: false
        default: regime
permissions:
  contents: read
concurrency:
  group: delay-replay
  cancel-in-progress: true
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync
      - name: Delay replay
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SINCE_INPUT: ${{ inputs.since }}
        run: |
          # The default shell is bash -e without pipefail; without it a failed
          # uv run would be hidden behind tee.
          set -o pipefail
          case "$DATABASE_URL" in
            postgres://*|postgresql://*) ;;
            *) echo "DATABASE_URL is not a Postgres DSN; refusing to run (would silently read ephemeral SQLite)"; exit 1 ;;
          esac
          # $SINCE_INPUT is not echoed: the step's env listing already shows it.
          args=()
          case "$SINCE_INPUT" in
            all) ;;
            regime)
              since=$(sed -n 's/^ *REGIME_SINCE: "\([0-9-]*\)"$/\1/p' .github/workflows/daily-diagnostics.yml)
              case "$since" in
                [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) args=(--since "$since") ;;
                *) echo "since 'regime': REGIME_SINCE in daily-diagnostics.yml did not resolve to one YYYY-MM-DD date (got '$since')"; exit 1 ;;
              esac
              ;;
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) args=(--since "$SINCE_INPUT") ;;
            "") echo "since is empty; use 'regime' (default), 'all' (full history), or a YYYY-MM-DD date"; exit 1 ;;
            *) echo "since must be 'regime', 'all', or a YYYY-MM-DD date"; exit 1 ;;
          esac
          uv run rainmaker delay-replay --allow-prod "${args[@]}" | tee delay-replay.txt
      - name: Write job summary
        if: always()
        run: |
          # The repo is public, so the summary and the artifact are too.
          if [ -f delay-replay.txt ]; then
            {
              echo '```text'
              cat delay-replay.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: delay-replay-${{ github.run_id }}
          path: delay-replay.txt
          if-no-files-found: ignore
          retention-days: 90
